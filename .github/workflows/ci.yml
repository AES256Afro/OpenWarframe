name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository or releases.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q --cov --cov-report=term

  # Build the standalone app the same way the release does, so a broken spec, missing data
  # file or retired runner shows up on the pull request instead of after a tag is pushed.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cli: dist/OpenWarframe/openwarframe-cli.exe
          - os: macos-latest
            cli: dist/OpenWarframe.app/Contents/MacOS/openwarframe-cli
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-groups
      - name: Build with PyInstaller
        run: uv run pyinstaller packaging/openwarframe.spec --noconfirm
      - name: Smoke test
        run: uv run python packaging/smoke_test.py ${{ matrix.cli }}
      - name: Third-party notices
        run: uv run python packaging/third_party_notices.py dist/THIRD_PARTY_LICENSES.txt
      - name: Check the PowerShell scripts parse
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem packaging -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | Format-List; throw "$($f.Name) has syntax errors" }
          }
      - name: Build the installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/build_installer.ps1
      - name: Installer smoke test (install, upgrade, uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter 'OpenWarframe-v*-windows-setup.exe' | Select-Object -First 1
          ./packaging/installer_smoke_test.ps1 $setup.FullName
      # so the installer from a pull request can be tried on a real PC before release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Windows'
        with:
          name: windows-setup
          path: dist/OpenWarframe-v*-windows-setup.exe
          if-no-files-found: error
          retention-days: 7
