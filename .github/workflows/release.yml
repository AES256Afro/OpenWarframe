name: Release

# On a version tag, build the standalone apps with PyInstaller and publish one GitHub
# release with:
#   OpenWarframe-<tag>-windows-setup.exe  the Windows installer (packaging/openwarframe.iss)
#   OpenWarframe-<tag>-windows.zip, SHA256SUMS.txt (covers the installer and the zip)
#   OpenWarframe-<tag>-macos.zip,   SHA256SUMS-macos.txt
#   constraints.txt   exact dependency versions, used by install.ps1
#   install.ps1       the installer as of this release (it installs the latest release)
# Each zip carries LICENSE, INSTALL.md and THIRD_PARTY_LICENSES.txt.
#
# The build jobs only get a read-only token. The release is created as a draft by the last
# job, which runs only after both builds pass, and is published once every file is
# attached, so a release is never public with one platform missing.
#
# The builds and the installer are unsigned (the Mac app is ad-hoc signed only);
# docs/INSTALL.md explains SmartScreen, Gatekeeper and checksum checks. workflow_dispatch
# re-runs a tag from 0.4.1 on; earlier tags predate the scripts this workflow calls, and
# tags from before the installer (0.6.x) get the zip only.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and attach assets to, e.g. v0.4.1"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            cli: dist/OpenWarframe/openwarframe-cli.exe
          # Apple Silicon; the native Mac Warframe client is Apple Silicon only too.
          - os: macos-latest
            name: macos
            cli: dist/OpenWarframe.app/Contents/MacOS/openwarframe-cli
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"

      - name: Check tag matches package version
        shell: bash
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/openwarframe/__init__.py)
          [ "v$v" = "$TAG" ] || { echo "Tag $TAG does not match __version__ $v"; exit 1; }

      - run: uv sync --locked --all-groups
      - name: Test
        run: uv run pytest -q

      - name: Build with PyInstaller
        run: uv run pyinstaller packaging/openwarframe.spec --noconfirm

      - name: Smoke test
        run: uv run python packaging/smoke_test.py ${{ matrix.cli }}

      - name: Third-party notices
        run: uv run python packaging/third_party_notices.py dist/THIRD_PARTY_LICENSES.txt

      # before the zip step, which adds LICENSE etc. to dist/OpenWarframe (the installer
      # adds its own copies); skipped for tags that predate packaging/openwarframe.iss
      - name: Build the installer (Windows)
        if: runner.os == 'Windows' && hashFiles('packaging/openwarframe.iss') != ''
        shell: pwsh
        run: ./packaging/build_installer.ps1

      - name: Installer smoke test (Windows)
        if: runner.os == 'Windows' && hashFiles('packaging/openwarframe.iss') != ''
        shell: pwsh
        run: ./packaging/installer_smoke_test.ps1 "dist/OpenWarframe-$env:TAG-windows-setup.exe"

      - name: Zip and checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = "OpenWarframe-$env:TAG-windows.zip"
          $setup = "OpenWarframe-$env:TAG-windows-setup.exe"
          New-Item -ItemType Directory -Force out | Out-Null
          $files = @($zip)
          if (Test-Path packaging/openwarframe.iss) {
            Copy-Item "dist/$setup" out/   # fails the job if the installer is missing
            $files = @($setup, $zip)
          }
          Copy-Item LICENSE, docs/INSTALL.md, dist/THIRD_PARTY_LICENSES.txt dist/OpenWarframe/
          Compress-Archive -Path dist/OpenWarframe -DestinationPath "out/$zip" -Force
          Push-Location out
          $sums = foreach ($f in $files) {
            "$((Get-FileHash $f -Algorithm SHA256).Hash.ToLower())  $f"
          }
          $sums | Out-File SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt
          Pop-Location
          # install script and pinned dependency list, attached once (from this job)
          Copy-Item packaging/install.ps1 out/
          uv export --locked --no-dev --no-emit-project --no-hashes --format requirements-txt -o out/constraints.txt

      - name: Zip and checksum (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          zip="OpenWarframe-$TAG-macos.zip"
          mkdir -p out
          cp LICENSE docs/INSTALL.md dist/
          # ditto keeps the bundle's symlinks, permissions and signature intact
          (cd dist && ditto -c -k --sequesterRsrc --keepParent OpenWarframe.app "../out/$zip")
          (cd dist && zip -q "../out/$zip" LICENSE INSTALL.md THIRD_PARTY_LICENSES.txt)
          (cd out && shasum -a 256 "$zip" > SHA256SUMS-macos.txt && cat SHA256SUMS-macos.txt)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: out/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: out

      - name: Attach to a draft release, then publish it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -l out
          # gh's view/upload find draft releases too; list them explicitly to be sure
          existing=$(gh release list -R "$REPO" --limit 200 --json tagName,isDraft \
            --jq "map(select(.tagName == \"$TAG\")) | first | if . == null then \"none\" elif .isDraft then \"draft\" else \"published\" end")
          if [ "$existing" = "none" ]; then
            gh release create "$TAG" -R "$REPO" --draft --verify-tag \
              --title "OpenWarframe $TAG" --generate-notes
          fi
          gh release upload "$TAG" -R "$REPO" out/* --clobber
          if [ "$existing" != "published" ]; then
            gh release edit "$TAG" -R "$REPO" --draft=false --latest
          fi
