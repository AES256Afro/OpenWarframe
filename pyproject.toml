[project]
name = "openwarframe"
version = "0.3.2"
description = "Export, explain and plan your Warframe account: Excel, PDF, JSON, SQLite and LLM briefs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "AES256Afro" }]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "typer>=0.12",
  "platformdirs>=4.2",
  "rich>=13.7",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
  "python-docx>=1.1",
  "pillow>=13.0.0",
  "mss>=10.2.0",
  "winrt-runtime>=4.2.1 ; sys_platform == 'win32'",
  "winrt-windows-media-ocr>=4!10.0.28000.2957 ; sys_platform == 'win32'",
  "winrt-windows-graphics-imaging>=4!10.0.28000.2957 ; sys_platform == 'win32'",
  "winrt-windows-storage-streams>=4!10.0.28000.2957 ; sys_platform == 'win32'",
  "winrt-windows-globalization>=4!10.0.28000.2957 ; sys_platform == 'win32'",
  "winrt-windows-foundation>=4!10.0.28000.2957 ; sys_platform == 'win32'",
  "winrt-windows-foundation-collections>=4!10.0.28000.2957 ; sys_platform == 'win32'",
  "pywebview>=6.2 ; sys_platform == 'win32'",
]

[project.scripts]
openwarframe = "openwarframe.cli:app"

[project.gui-scripts]
openwarframe-app = "openwarframe.app:main"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openwarframe"]

[tool.hatch.build.targets.wheel.force-include]
"kb" = "openwarframe/kb_data"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
