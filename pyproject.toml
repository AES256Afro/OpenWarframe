[project]
name = "openwarframe"
version = "0.1.0"
description = "Export, explain and plan your Warframe account: Excel, PDF, JSON, SQLite and LLM briefs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "AES256Afro" }]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "typer>=0.12",
  "platformdirs>=4.2",
  "rich>=13.7",
  "openpyxl>=3.1",
]

[project.scripts]
openwarframe = "openwarframe.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openwarframe"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
