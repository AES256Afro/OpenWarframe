<nav class="side" aria-label="Views">

  <div class="who" id="who">Loading…</div>
  <div id="tabs" role="tablist"></div>
  <div class="spacer"></div>
  <button class="btn" id="refresh" type="button" title="Refresh profile"><span class="lbl">Refresh profile</span><span class="ab" aria-hidden="true">Prof</span></button>
  <button class="btn primary" id="grab" type="button" title="Get inventory from game"><span class="lbl">Get inventory from game</span><span class="ab" aria-hidden="true">Inv</span></button>
  <button class="btn" id="loadinv" type="button" title="Load inventory file"><span class="lbl">Load inventory file…</span><span class="ab" aria-hidden="true">File</span></button>
  <button class="btn" id="export" type="button" title="Export my account"><span class="lbl">Export my account…</span><span class="ab" aria-hidden="true">Exp</span></button>
  <button class="btn" id="updatedata" type="button" title="Update game data"><span class="lbl">Update game data</span><span class="ab" aria-hidden="true">Data</span></button>
  <button class="btn" id="compact" type="button" aria-pressed="false" title="Narrow sidebar"><span class="lbl">Narrow sidebar</span><span class="ab" aria-hidden="true">&raquo;</span></button>
  <a class="upd" id="newversion" hidden target="_blank" rel="noopener"></a>
  <button class="btn primary updnow" id="updatenow" type="button" hidden>Update now</button>
  <input type="file" id="invfile" accept=".json,application/json" hidden>

<main>
  <div class="top">
    <h1 id="title">Overview</h1>
    <input type="search" id="q" placeholder="Search names, parts, sources" aria-label="Search items">
    <button class="btn" id="csv" type="button">Export CSV</button>
  </div>
  <div class="fbar" id="fbar" hidden></div>
  <div class="filters" id="filters"></div>
  <div class="wrap" id="view" role="tabpanel"></div>
  <footer id="foot"></footer>
</main>
<div class="drop" id="dropzone" hidden>Drop your inventory JSON to load it</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<dialog id="keys" class="dialog" aria-labelledby="keys-title"><div style="display:grid; gap:12px"><h2 id="keys-title" style="margin:0; font-size:16px">Keyboard shortcuts</h2>
<dl class="keys"><dt><kbd>/</kbd></dt><dd>Search</dd><dt><kbd>?</kbd></dt><dd>Show this list</dd><dt><kbd>&uarr;</kbd> <kbd>&darr;</kbd></dt><dd>Move between views in the sidebar</dd><dt><kbd>Enter</kbd></dt><dd>Open or close a row's details</dd><dt><kbd>Esc</kbd></dt><dd>Close this list</dd><dt>Back, Forward</dt><dd>Go to the view you were on</dd></dl>
<div style="display:flex; justify-content:flex-end"><button class="btn" type="button" id="keys-close" autofocus>Close</button></div></div></dialog>
<dialog id="consent" class="dialog" aria-labelledby="consent-title" aria-describedby="risktext"><div style="display:grid; gap:12px"><h2 id="consent-title" style="margin:0; font-size:16px">Read your game session?</h2><p id="risktext" style="margin:0"></p><div style="display:flex; gap:8px; justify-content:flex-end"><button class="btn" type="button" id="consent-no" autofocus>Cancel</button><button class="btn primary" type="button" id="consent-yes">I accept the risk, continue</button></div></div></dialog>
