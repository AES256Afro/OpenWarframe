<style>
/* Layout: app shell. Sidebar of views on the left, a toolbar of filters over one sortable table. Orokin gold marks mastery, Tenno cyan marks actions. */
:root{
  --bg:#0a0f1d; --panel:#121a2c; --panel2:#18223a; --row:#141d31; --fg:#e7ecf6; --muted:#97a3bc; --line:#27334f;
  --gold:#d9b35b; --gold-soft:#3a3016; --cyan:#4fd1ea; --cyan-soft:#12313b;
  --ok:#5fd49a; --warn:#f0b35b; --bad:#f07a70; --violet:#a98cf5;
  --ok-soft:#173226; --warn-soft:#3a2c14; --bad-soft:#3b1d1c; --violet-soft:#2a2344; --on-accent:#0a0f1d;
  --display:"Cinzel", Georgia, serif; --body:"Segoe UI", system-ui, sans-serif; --mono:"Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#eef1f6; --panel:#ffffff; --panel2:#f3f6fa; --row:#fafbfd; --fg:#172033; --muted:#566178; --line:#d6dce7;
    /* every text/background pair below is at least 4.5:1 (WCAG AA) at the small pill size */
    --gold:#6e5010; --gold-soft:#f3e7c9; --cyan:#0a5f72; --cyan-soft:#d9f0f5; --ok:#1a6e45; --warn:#8a4f06; --bad:#9c2d26; --violet:#5a3fc0;
    --ok-soft:#ddefe5; --warn-soft:#f8ead3; --bad-soft:#f8dfdc; --violet-soft:#ebe5fb; --on-accent:#ffffff; color-scheme: light; }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 var(--body); display:grid; grid-template-columns:220px 1fr; overflow:hidden}
nav.side{background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:16px 10px; gap:4px; overflow:auto}
.brand{font:700 14px var(--display); letter-spacing:.08em; white-space:nowrap; color:var(--gold); padding:4px 10px 2px; display:flex; align-items:center; gap:9px}
.brand svg{width:24px; height:24px; flex:none}
.who{color:var(--muted); font-size:12px; padding:0 10px 12px; border-bottom:1px solid var(--line); margin-bottom:8px}
.who b{color:var(--fg)}
.tab{display:flex; justify-content:space-between; align-items:center; gap:8px; width:100%; text-align:left; background:none; border:0; color:var(--fg); font:600 14px var(--body); padding:9px 10px; border-radius:8px; cursor:pointer}
.tab:hover{background:var(--panel2)}
.tab[aria-selected="true"]{background:var(--cyan-soft); color:var(--cyan)}
.tab .n{font:12px var(--mono); color:var(--muted)}
.side .spacer{flex:1}
.side .btn{margin:4px 0}
.side .upd{display:block; margin:6px 0 0; padding:8px 10px; border-radius:8px; background:var(--gold-soft); color:var(--gold); font-weight:600; font-size:13px; text-decoration:none}
.fresh{margin:12px 18px 0; padding:10px 14px; border-radius:10px; border:1px solid var(--line); background:var(--panel); display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.fresh p{margin:0; flex:1 1 380px}
main{display:flex; flex-direction:column; min-width:0; min-height:0}
main > .wrap{flex:1}
.top{display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:14px 18px 10px; border-bottom:1px solid var(--line)}
.top h1{font:700 20px var(--display); margin:0 auto 0 0; letter-spacing:.03em}
input[type=search], select{background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:14px var(--body)}
input[type=search]{width:260px}
.btn{background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font:600 13px var(--body); cursor:pointer}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold); color:var(--on-accent); border-color:var(--gold)}
.btn:focus-visible, .tab:focus-visible, .chip:focus-visible, th button:focus-visible{outline:2px solid var(--cyan); outline-offset:2px}
.filters{display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 18px; border-bottom:1px solid var(--line); background:var(--panel)}
.chip{background:var(--panel2); color:var(--fg); border:1px solid var(--line); border-radius:999px; padding:5px 12px; font:600 12.5px var(--body); cursor:pointer}
.chip[aria-pressed="true"]{background:var(--cyan); color:var(--on-accent); border-color:var(--cyan)}
.chip .c{font:11px var(--mono); opacity:.8; margin-left:4px}
.filters label{display:flex; gap:6px; align-items:center; color:var(--muted); font-size:13px}
.notice{margin:12px 18px 0; padding:12px 14px; border-radius:10px; background:var(--gold-soft); display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.notice p{margin:0; flex:1 1 420px}
.wrap{overflow:auto; min-height:0}
table{border-collapse:separate; border-spacing:0; width:100%}
th{position:sticky; top:0; background:var(--panel); z-index:1; text-align:left; border-bottom:1px solid var(--line); padding:0}
th button{all:unset; display:block; width:100%; box-sizing:border-box; padding:10px 12px; font:600 11.5px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); cursor:pointer}
th button:hover{color:var(--fg)}
th[aria-sort="ascending"] button::after{content:" ▲"; color:var(--gold)}
th[aria-sort="descending"] button::after{content:" ▼"; color:var(--gold)}
td{padding:8px 12px; border-bottom:1px solid var(--line); vertical-align:top}
tbody tr{background:var(--row); cursor:pointer}
tbody tr:hover{background:var(--panel2)}
tbody tr[data-i]:focus-visible{outline:2px solid var(--cyan); outline-offset:-2px}
input:focus-visible, select:focus-visible, summary:focus-visible{outline:2px solid var(--cyan); outline-offset:2px}
td.num{font:13px var(--mono); text-align:right; white-space:nowrap}
td.name{font-weight:600}
.pill{display:inline-block; border-radius:999px; padding:2px 9px; font:600 11.5px var(--body); white-space:nowrap}
.p-mastered{background:var(--gold-soft); color:var(--gold)}
.p-leveling{background:var(--cyan-soft); color:var(--cyan)}
.p-never{background:var(--panel2); color:var(--muted); border:1px solid var(--line)}
.p-owned{background:var(--ok-soft); color:var(--ok)}
.p-warn{background:var(--warn-soft); color:var(--warn)}
.p-bad{background:var(--bad-soft); color:var(--bad)}
.p-violet{background:var(--violet-soft); color:var(--violet)}
.muted{color:var(--muted)}
tr.detail td{background:var(--panel); cursor:default}
.drops{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:6px 18px; font-size:13px}
.drops .need{color:var(--ok); font-weight:600}
.drops .done{color:var(--muted); text-decoration:line-through}
.empty{padding:40px 18px; color:var(--muted); text-align:center}
.setup{padding:24px 18px; max-width:760px; display:grid; gap:14px}
.setup h1{margin:0; font:700 24px var(--body)}
.setup ol{margin:0; padding-left:1.3em; display:grid; gap:4px}
.setup input{background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:14px var(--mono); width:260px}
.setup .row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
footer{display:flex; gap:16px; flex-wrap:wrap; padding:8px 18px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; background:var(--panel)}
.overview{padding:18px; display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; align-content:start}
.card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px}
.card .v{font:700 26px var(--mono)}
.card .k{color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.08em}
.bar{height:8px; background:var(--panel2); border-radius:4px; overflow:hidden; margin-top:8px}
.bar i{display:block; height:100%; background:var(--gold)}
.now{margin:14px 18px 0; padding:16px 18px; border-radius:12px; background:var(--panel); border:1px solid var(--gold); display:grid; gap:6px}
.now .eyebrow{font:600 11px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--gold)}
.now .what{font:700 18px var(--body)}
.now .why{color:var(--muted)}
.now .also{display:flex; flex-wrap:wrap; gap:8px 18px; font-size:13px; margin-top:4px}
.cards{padding:14px 18px; display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px; align-content:start}
.fcard{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; display:grid; gap:8px; align-content:start}
.fcard h3{margin:0; font:700 15px var(--body); display:flex; justify-content:space-between; gap:8px}
.fcard ul{margin:0; padding-left:1.1em; display:grid; gap:6px; font-size:13px}
.fcard .ok{color:var(--muted); text-decoration:line-through}
.fcard .src{color:var(--muted); font-size:12px}
.fcard .route{font-size:12px; color:var(--ok)}
.fcard .route.no{color:var(--warn)}
.fbar{display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; padding:9px 18px; background:var(--gold-soft); border-bottom:1px solid var(--line)}
.fbar .lbl{font:600 11px var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--gold)}
.fbar .what{font-weight:700; flex:1 1 320px}
.fbar .why{color:var(--muted); font-size:13px}
.focus{padding:18px; display:grid; gap:16px; max-width:1100px}
.big{background:var(--panel); border:2px solid var(--gold); border-radius:14px; padding:20px 22px; display:grid; gap:8px}
.big .what{font:700 22px var(--body)}
.big .why{color:var(--muted); font-size:15px}
.big .meta{display:flex; flex-wrap:wrap; gap:8px 18px; font-size:13px; color:var(--muted)}
.big .acts{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px}
.row2{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; align-items:start}
.box{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; display:grid; gap:10px}
.box h2{margin:0; font:700 15px var(--body); display:flex; justify-content:space-between; gap:8px; align-items:baseline}
.box h2 .muted{font:400 12px var(--body)}
.tick{display:grid; grid-template-columns:20px 1fr auto; gap:10px; align-items:start; padding:6px 0; border-bottom:1px dashed var(--line); cursor:pointer}
.tick:last-child{border-bottom:0}
.tick input{width:17px; height:17px; margin-top:2px; accent-color:var(--gold)}
.tick .m{font:12px var(--mono); color:var(--muted); white-space:nowrap}
.tick small{display:block; color:var(--muted)}
.tick:has(input:checked) .t{text-decoration:line-through; color:var(--muted)}
.tick.opt:has(input:checked) .t{text-decoration:none; color:inherit} /* a setting that is on, not a task done */
.gloss{margin:0; display:grid; grid-template-columns:minmax(140px,auto) 1fr; gap:6px 14px; font-size:13px}
.gloss dt{font-weight:700} .gloss dd{margin:0; color:var(--muted)}
details.box summary{cursor:pointer}
.goal{display:grid; gap:4px; padding:6px 0; border-bottom:1px dashed var(--line)}
.goal:last-child{border-bottom:0}
.goal .bar{margin-top:0}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
.seg button{background:var(--panel); color:var(--fg); border:0; border-right:1px solid var(--line); padding:7px 12px; font:600 13px var(--body); cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--cyan); color:var(--on-accent)}
:root.hc{--muted:#c9d3e6; --line:#5a6a8c; --panel2:#22304f}
@media (prefers-color-scheme: light){ :root.hc{--muted:#2c3446; --line:#7d879b} }
:root.calm *{transition:none !important; animation:none !important}
.drop{position:fixed; inset:0; background:rgba(5,8,16,.7); display:flex; align-items:center; justify-content:center; z-index:5; font:600 18px var(--body)}
.dialog{max-width:560px; background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:12px; padding:18px 20px}
.dialog::backdrop{background:rgba(5,8,16,.7)}
.toast button{margin-left:10px}
.toast{position:fixed; right:18px; bottom:48px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 14px; z-index:6; max-width:420px}
body.big-text{grid-template-columns:150px 1fr}
body.big-text .tab .n, body.big-text .brand span{display:none}
@media (max-width:820px){ body{grid-template-columns:1fr; overflow:auto} nav.side{flex-direction:row; flex-wrap:wrap} .who,.spacer{display:none} input[type=search]{width:100%} }
</style>
</head>
<body>
<nav class="side" aria-label="Views">
  <div class="brand"><svg viewBox="0 0 512 512" aria-hidden="true"><rect x="8" y="8" width="496" height="496" rx="112" fill="#0d1426"/> <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="#2a3756" stroke-width="10"/> <circle cx="256" cy="256" r="156" fill="none" stroke="#1c2741" stroke-width="44"/> <circle cx="256" cy="256" r="156" fill="none" stroke="#d9b35b" stroke-width="44" stroke-linecap="round" stroke-dasharray="720 980" transform="rotate(-90 256 256)"/> <path d="M256 164 L344 256 L256 348 L168 256 Z" fill="#4fd1ea"/> <path d="M256 164 L344 256 L256 256 Z" fill="#a6eefa" opacity="0.6"/> <path d="M168 256 L256 348 L256 256 Z" fill="#1aa6c2" opacity="0.55"/></svg><span>OPENWARFRAME</span></div>
  <div class="who" id="who">Loading…</div>
  <div id="tabs" role="tablist"></div>
  <div class="spacer"></div>
  <button class="btn" id="refresh" type="button">Refresh profile</button>
  <button class="btn primary" id="grab" type="button">Get inventory from game</button>
  <button class="btn" id="loadinv" type="button">Load inventory file…</button>
  <button class="btn" id="export" type="button">Export my account…</button>
  <button class="btn" id="updatedata" type="button">Update game data</button>
  <a class="upd" id="newversion" hidden target="_blank" rel="noopener"></a>
  <input type="file" id="invfile" accept=".json,application/json" hidden>
</nav>
<main>
  <div class="top">
    <h1 id="title">Overview</h1>
    <input type="search" id="q" placeholder="Search names, parts, sources" aria-label="Search items">
    <button class="btn" id="csv" type="button">Export CSV</button>
  </div>
  <div class="fbar" id="fbar" hidden></div>
  <div class="filters" id="filters"></div>
  <div class="wrap" id="view" role="tabpanel"></div>

</main>
<div class="drop" id="dropzone" hidden>Drop your inventory JSON to load it</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<dialog id="consent" class="dialog" aria-labelledby="consent-title" aria-describedby="risktext"><div style="display:grid; gap:12px"><h2 id="consent-title" style="margin:0; font-size:16px">Read your game session?</h2><p id="risktext" style="margin:0"></p><div style="display:flex; gap:8px; justify-content:flex-end"><button class="btn" type="button" id="consent-no" autofocus>Cancel</button><button class="btn primary" type="button" id="consent-yes">I accept the risk, continue</button></div></div></dialog>

<script>
(function(){
"use strict";
var REWARD=null, REWARD_POLL=null;
var PREFS={goals:[],checks:{},settings:{},skipped:{}}, SESSION=null, SESSION_TICKS={}, EASY=false;
// What this computer and account can do comes from the server (caps). Before the first data
// load, fall back to a guess from the browser.
var MAC=/Macintosh|Mac OS X/.test(navigator.userAgent);
function caps(d){ var src=d||DATA; return (src&&src.meta&&src.meta.caps)||(src&&src.caps)||{game_here:true, grab:!MAC, ocr:true, platform_label:"PC", os:MAC?"mac":"windows"}; }
// One sentence on how to get the inventory, for this computer and account.
function invHint(lead){
  var c=caps();
  if(c.grab) return lead+" With Warframe running and you in your Orbiter, click Get inventory from game.";
  if(!c.game_here) return lead+" Your account plays on "+c.platform_label+", so OpenWarframe works from your public profile; the inventory needs the PC game on this computer.";
  return lead+" Reading it from the running game only works on Windows. If you have an inventory file saved on a Windows PC (openwarframe inventory grab writes one), click Load inventory file.";
}
var DATA=null, LIVE=null, LIVE_AT=0, VIEW="overview", SORT={relics:{k:"count",dir:-1}}, Q="", F={}, OPEN={};
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
// numbers from files and third-party sites: show them only if they really are numbers
var amt=function(v){var n=Number(v);return v==null||v===""||!isFinite(n)?0:n};
function toast(msg, ms, action){
  var t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(t._h);
  if(action){  // e.g. {label:"Undo", run:fn}: a way back for one-click actions
    var b=document.createElement("button"); b.type="button"; b.className="btn"; b.textContent=action.label;
    b.onclick=function(){ t.hidden=true; action.run(); }; t.appendChild(b);
  }
  t._h=setTimeout(function(){t.hidden=true}, ms||(action?8000:4000));
}

var VIEWS=[
  {id:"focus", label:"Focus"},
  {id:"overview", label:"Overview"},
  {id:"farm", label:"What to farm"},
  {id:"live", label:"Live"},
  {id:"rewards", label:"Reward helper"},
  {id:"Warframes", label:"Warframes", group:"Warframes"},
  {id:"Weapons", label:"Weapons", group:"Weapons"},
  {id:"Companions", label:"Companions & more", group:"Companions & more"},
  {id:"relics", label:"Relics"},
  {id:"blueprints", label:"Blueprints"},
  {id:"foundry", label:"Foundry"},
  {id:"resources", label:"Resources"},
  {id:"earn", label:"Earnings"},
  {id:"sell", label:"Sell list"},
  {id:"mods", label:"Mods & arcanes"},
  {id:"locked", label:"Can't get yet"},
  {id:"all", label:"All items"}
];

function pill(state){
  var cls={"Mastered":"p-mastered","Owned, mastered":"p-mastered","Leveling":"p-leveling","Owned, not mastered":"p-leveling","Mastered, not owned":"p-violet","Never leveled":"p-never","Not owned":"p-never"}[state]||"p-never";
  return '<span class="pill '+cls+'">'+esc(state)+'</span>';
}
function accessPill(a){
  if(a==="Available") return '<span class="pill p-owned">Available</span>';
  if(a==="Leveled before") return '<span class="muted">-</span>';
  if(a&&a.indexOf("Needs MR")===0) return '<span class="pill p-bad">'+esc(a)+'</span>';
  return '<span class="pill p-warn">'+esc(a)+'</span>';
}

// ---- data views -------------------------------------------------------------
function itemRows(){
  var v=VIEWS.find(function(x){return x.id===VIEW});
  var rows=DATA.items;
  if(v&&v.group) rows=rows.filter(function(r){return r.group===v.group});
  if(VIEW==="locked") rows=rows.filter(function(r){return r.access!=="Available"&&r.access!=="Leveled before"});
  return rows;
}
var ITEM_COLS=[
  {k:"name",l:"Name",cls:"name"},{k:"category",l:"Type"},{k:"state",l:"Status",fmt:pill},
  {k:"rank",l:"Rank",cls:"num"},{k:"mr",l:"MR req",cls:"num"},{k:"how",l:"How to get"},{k:"access",l:"Access",fmt:accessPill}
];
var RELIC_COLS=[
  {k:"name",l:"Relic",cls:"name"},{k:"tier",l:"Tier"},

function matches(r){
  if(Q){
    var hay=(r.name+" "+(r.category||"")+" "+(r.how||"")+" "+(r.sources||[]).join(" ")+" "+(r.drops||[]).map(function(d){return d.part+" "+d.for}).join(" ")+" "+(r.parts||[]).map(function(p){return p.name}).join(" ")+" "+(r.pieces||[]).map(function(p){return p.name+" "+p.sources.join(" ")}).join(" ")+" "+(r.place||"")+" "+(r.gives||[]).join(" ")+" "+(r.where||"")+" "+(r.mission||"")+" "+(r.tier||"")).toLowerCase();
    if(hay.indexOf(Q)<0) return false;
  }
  for(var k in F){ var want=F[k]; if(want==null||want===""||k==="sub") continue;
    if(typeof want==="function"){ if(!want(r)) return false; }
    else if(String(r[k])!==String(want)) return false;
  }
  return true;
}
function filtered(){ var s=currentSpec(); return s.rows.filter(matches); }
function sorted(rows){
  var s=SORT[VIEW]; if(!s) return rows;
  var k=s.k, d=s.dir;
  return rows.slice().sort(function(a,b){
    var x=a[k], y=b[k];
    if(x==null&&y==null) return 0; if(x==null) return 1; if(y==null) return -1;
    if(typeof x==="number"&&typeof y==="number") return (x-y)*d;
    if(typeof x==="boolean") return ((x?1:0)-(y?1:0))*d;
    return String(x).localeCompare(String(y))*d;
  });
}

function dayKey(){ return new Date().toISOString().slice(0,10); }

  h+='<details class="box"><summary><b>What do these words mean?</b></summary><dl class="gloss">'+GLOSSARY.map(function(g){return '<dt>'+esc(g[0])+'</dt><dd>'+esc(g[1])+'</dd>'}).join('')+'</dl></details>';
  // comfort
  var st=PREFS.settings||{};
  h+='<div class="box"><h2>Comfort</h2>';
  h+='<div>Text size <span class="seg">'+[[1,"100%"],[1.15,"115%"],[1.3,"130%"],[1.5,"150%"],[1.75,"175%"],[2,"200%"]].map(function(z){return '<button type="button" data-zoom="'+z[0]+'" aria-pressed="'+((st.zoom||1)===z[0])+'">'+z[1]+'</button>'}).join('')+'</span></div>';
  h+='<label class="tick opt"><input type="checkbox" id="st-contrast"'+(st.contrast?' checked':'')+'><span class="t">Higher contrast</span><span></span></label>';
  h+='<label class="tick opt"><input type="checkbox" id="st-calm"'+(st.calm?' checked':'')+'><span class="t">No motion</span><span></span></label>';
  h+='<label class="tick opt"><input type="checkbox" id="st-bar"'+(st.bar!==false?' checked':'')+'><span class="t">Show the Next bar on every screen</span><span></span></label>';
  h+='<label class="tick opt"><input type="checkbox" id="st-owned"'+(st.ownedonly!==false?' checked':'')+'><span class="t">Only suggest relics I already have<small>Off: also suggests farming a relic first</small></span><span></span></label>';
  h+='<label class="tick opt"><input type="checkbox" id="st-updates"'+(st.check_updates!==false?' checked':'')+'><span class="t">Tell me when a new version is out<small>Asks GitHub once a day. Nothing about you is sent.</small></span><span></span></label>';
  h+='<label class="tick opt"><input type="checkbox" id="st-start"'+(st.start!=="last"?' checked':'')+'><span class="t">Open on this Focus screen</span><span></span></label>';
  h+='<div class="tick opt"><span class="t">Account: '+esc(DATA.meta.player||"not named")+' ('+esc((DATA.meta.platform||"pc").toUpperCase())+')<small>Switch to another account. Each account keeps its own profile history and inventory, so you can switch back.</small></span><button class="btn" type="button" id="st-account">Change account</button></div>';
  if(DATA.meta.session_ok) h+='<div class="tick"><span class="t">You allowed reading the game session<small>Get inventory from game reads the running game. Take this back and the app will ask again next time.</small></span><button class="btn" type="button" id="st-consent">Take back permission</button></div>';
  h+='<details><summary class="muted">Hide routine items I never do</summary>'+DAILY.concat(WEEKLY).map(function(x){return '<label class="tick opt"><input type="checkbox" data-hide="'+x.id+'"'+(hiddenRoutine(x.id)?' checked':'')+'><span class="t">Hide '+esc(x.t)+'</span><span></span></label>'}).join('')+'</details>';
  h+='</div>';
  h+='</div></div>';
  $("view").innerHTML=h;
  if(s){
    $("fx-done").onclick=function(){ doneSuggestion(s); };
    if(s.action==="grab") $("fx-done").textContent=caps().grab?"Get inventory from game":"Load inventory file";
    $("fx-skip").onclick=function(){ skip(s.id); };
    $("fx-tired").onclick=function(){ EASY=!EASY; renderAll(); toast(EASY?"Quickest things first. Click again to switch back.":"Back to the usual order."); };
    if($("fx-go")) $("fx-go").onclick=function(){ goView(s.go); renderAll(); };
  }
  $("view").querySelectorAll("[data-plan]").forEach(function(b){ b.onclick=function(){ planSession(+b.dataset.plan); }; });
  $("view").querySelectorAll("[data-st]").forEach(function(b){ b.onchange=function(){ SESSION_TICKS[b.dataset.st]=b.checked; var it=SESSION.items[+b.dataset.st];
    if(b.checked && it.routine) setCheck(it.routine,it.rid,true);
    else if(b.checked) skip(it.id, true);  // ticked here: the big card moves on too
    saveSession(); renderAll(); }; });
  $("view").querySelectorAll("[data-ck]").forEach(function(b){ b.onchange=function(){ var p=b.dataset.ck.split(":"); setCheck(p[0],p[1],b.checked); renderAll(); }; });
  $("view").querySelectorAll("[data-ungoal]").forEach(function(b){ b.onclick=function(){ toggleGoal(b.dataset.ungoal); }; });
  $("view").querySelectorAll("[data-zoom]").forEach(function(b){ b.onclick=function(){ setSetting("zoom", +b.dataset.zoom); }; });
  $("view").querySelectorAll("[data-hide]").forEach(function(b){ b.onchange=function(){ var hd=((PREFS.settings||{}).hide||[]).filter(function(x){return x!==b.dataset.hide}); if(b.checked) hd.push(b.dataset.hide); setSetting("hide",hd); }; });
  if($("st-account")) $("st-account").onclick=function(){ renderSetup({error:"Type the account ID to switch to. Your current account stays saved, so you can switch back the same way.", setup:true, has_account:false, switching:true}); };
  if($("st-consent")) $("st-consent").onclick=function(){ api("/api/consent/forget",{method:"POST"}).then(function(){ DATA.meta.session_ok=false; renderAll(); toast("Permission taken back. The app will ask before reading the game again."); }).catch(function(){ toast("Could not reach OpenWarframe. Is the app still running?"); }); };
  var bind2=function(id,k,fn){ var e=$(id); if(e) e.onchange=function(){ setSetting(k, fn(e.checked)); }; };
  bind2("st-contrast","contrast",function(v){return v}); bind2("st-calm","calm",function(v){return v});
  bind2("st-bar","bar",function(v){return v}); bind2("st-updates","check_updates",function(v){ setTimeout(checkUpdate, 300); return v; }); bind2("st-owned","ownedonly",function(v){return v}); bind2("st-start","start",function(v){return v?"focus":"last"});
  return [];
}

// Re-rendering replaces the HTML, which drops keyboard focus to the page. Remember what had
// focus (by id or by its data- attribute) and put focus back on the same control afterwards.
function focusKey(el){
  if(!el||el===document.body||!document.contains(el)) return null;
  if(el.id) return "#"+CSS.escape(el.id);
  for(var i=0;i<el.attributes.length;i++){ var a=el.attributes[i];
    if(a.name.indexOf("data-")===0) return el.tagName.toLowerCase()+"["+a.name+'="'+CSS.escape(a.value)+'"]'; }
  return null;
}
function keepFocus(fn){
  var key=focusKey(document.activeElement), out=fn();
  if(key){ var el=document.querySelector(key); if(el&&el!==document.activeElement) el.focus({preventScroll:true}); }
  return out;
}
function renderAll(){ var out=keepFocus(renderAllNow); rememberView(); return out; }
// Filters and sort are kept per view, so coming back (or restarting) shows the list as you left it.
var VIEW_STATE_SAVED="";
function rememberView(){
  if(!DATA) return;
  PREFS.views=PREFS.views||{};
  PREFS.views[VIEW]={F:F, sort:SORT[VIEW]||null};
  var now=JSON.stringify(PREFS.views);
  if(now!==VIEW_STATE_SAVED){ VIEW_STATE_SAVED=now; clearTimeout(rememberView.t); rememberView.t=setTimeout(savePrefs, 800); }
}
function goView(v){ VIEW=v; OPEN={}; var st=(PREFS.views||{})[v]; F=st&&st.F?JSON.parse(JSON.stringify(st.F)):{}; if(st&&st.sort) SORT[v]=st.sort; }
function renderAllNow(){
  if(!DATA) return;
  if(VIEW!=="rewards") rewardPoll(false);
  var v=VIEWS.find(function(x){return x.id===VIEW})||VIEWS[0];
  $("title").textContent=v.label; renderTabs(); renderFilters(); renderNotice(); renderFreshness(); renderFocusBar();
  if(VIEW==="focus"){ $("filters").hidden=true; $("csv").hidden=true; renderFocus(); $("foot").innerHTML='<span>Goals, ticks and settings are saved in your OpenWarframe folder.</span>'; return; }
  if(VIEW==="overview"){ renderOverview(); $("csv").hidden=true; return; }
  $("csv").hidden=false;
  var rows;
  if(VIEW==="farm"&&farmSub()==="finish"){ rows=renderFinish(); }
  else if(VIEW==="earn"){ rows=renderEarnings(); $("csv").hidden=true; }
  else if(VIEW==="rewards"){ rows=renderRewards(); $("csv").hidden=true; }
  else if(VIEW==="live"){ loadLive(false); rows=renderTable(); $("view").insertAdjacentHTML("afterbegin", liveHeader()); }
  else { rows=renderTable(); if(VIEW==="farm") $("view").insertAdjacentHTML("afterbegin", nowCard()); }
  $("foot").innerHTML='<span>'+rows.length+' shown</span><span>Profile '+new Date(DATA.meta.snapshot).toLocaleString()+'</span><span>'+(DATA.meta.inventory?"Inventory loaded "+new Date(DATA.meta.inventory.loaded).toLocaleString():"No inventory loaded")+'</span><span>Click a row for details. Click a column to sort.</span>';
}
function load(data){
  if(data.error&&data.setup){ renderSetup(data); return; }
  if(data.error){
    $("view").innerHTML='<div class="empty"><p>'+esc(data.error)+'</p><p>'+(data.can_update?'<button class="btn primary" type="button" id="err-update">Update game data</button> ':'')+'<button class="btn" type="button" id="err-retry">Try again</button></p></div>';
    $("who").textContent="";
    if(data.can_update) $("err-update").onclick=function(){ $("view").innerHTML='<div class="empty">Updating the game database. This can take a minute…</div>'; api("/api/codex/update",{method:"POST"}).then(load).catch(function(){ $("view").innerHTML='<div class="empty">The update failed. Check your internet connection and try again.</div>'; }); };
    $("err-retry").onclick=function(){ $("view").innerHTML='<div class="empty">Loading…</div>'; api("/api/data").then(load); };
    return;
  }
  DATA=data;
  $("grab").hidden=!caps().grab;
  // the gold button is for the one thing to do next: loading the inventory, until it is loaded
  $("grab").classList.toggle("primary", !data.meta.inventory);
  $("who").innerHTML='<b>'+esc((data.meta.player||"Your account").replace(/[-]/g,""))+'</b><br>MR '+data.meta.mr+' · '+esc((data.meta.platform||"").toUpperCase());
  renderAll();
}
function checkPrices(){
  var spec=currentSpec();
  var rows=sorted(filtered()).filter(function(r){return r.slug && r.price==null && (spec.key==="relics"||r.spare>0)}).slice(0,80);
  if(!rows.length){ toast("Prices are already shown for these relics."); return; }
  toast("Checking warframe.market for "+rows.length+" relics. This takes up to a minute.", 60000);
  api("/api/prices",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({kind:spec.key, ids:rows.map(function(r){return r.id})})})
    .then(function(p){
      (DATA[spec.key]||[]).forEach(function(r){ if(p[r.id]) r.price=p[r.id].typical; });
      SORT[VIEW]={k:"price",dir:-1}; renderAll();
      toast("Prices loaded for "+Object.keys(p).length+" relics. Sorted by market value. Filter or sort, then check again for more.");
    }).catch(function(){ toast("Could not reach warframe.market."); });
}
function renderSetup(d){
  if(!d.switching) $("who").textContent="";
  $("title").textContent=d.switching?"Change account":"Get started"; $("csv").hidden=true;
  var h='<div class="setup"><h1>'+(d.switching?'Change account':'Welcome to OpenWarframe')+'</h1><p class="muted">'+esc(d.error)+'</p>';
  if(d.has_account){
    h+='<div class="box"><p>Your account is set. Fetch your public profile to fill the app.</p><div class="row"><button class="btn primary" type="button" id="setup-refresh">Fetch my profile</button></div></div>';
  } else {
    if(d.switching) h+='<div class="row"><button class="btn" type="button" id="setup-back">Keep the current account</button></div>';
    h+=(!caps(d).grab||d.switching?'':'<div class="box"><h2>From the running game (Windows only)</h2><p>Start Warframe, log in and wait until you are in your Orbiter. Then click the button. OpenWarframe finds your account and loads your full inventory (relics, blueprints, resources) in one go.</p><div class="row"><button class="btn primary" type="button" id="setup-grab">Find my account in the game</button></div></div>')
      +'<div class="box"><h2>'+(!caps(d).grab||d.switching?'Type your account ID':'Or type your account ID')+'</h2><ol><li>Log in at warframe.com in your browser.</li><li>Press F12 and open the Application tab (Storage in Firefox).</li><li>Under Cookies, pick www.warframe.com and copy the value of <b>gid</b>.</li></ol>'
      +'<p class="muted">It works like a user name, not a password: it only opens the same read-only profile anyone can view in the game.</p>'
      +'<div class="row"><label for="setup-id" class="muted">Account ID</label><input id="setup-id" autocomplete="off" spellcheck="false" maxlength="40" placeholder="24 characters, 0-9 and a-f"><select id="setup-plat" aria-label="Platform"><option value="pc">PC</option><option value="ps4">PlayStation</option><option value="xb1">Xbox</option><option value="swi">Nintendo Switch</option><option value="mob">iOS</option><option value="and">Android</option></select><button class="btn" type="button" id="setup-save">Save and fetch</button></div></div>';
  }
  $("view").innerHTML=h+'</div>';
  if(d.has_account){ $("setup-refresh").onclick=function(){ $("refresh").click(); }; return; }
  if($("setup-grab")) $("setup-grab").onclick=function(){ grab(false); };
  if($("setup-back")) $("setup-back").onclick=function(){ load(DATA); };
  $("setup-save").onclick=function(){
    var id=$("setup-id").value.trim();
    if(!id){ $("setup-id").focus(); return; }
    toast("Fetching your profile…", 20000);
    api("/api/account",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:id, platform:$("setup-plat").value})})
      .then(function(r){ if(r.error&&!r.setup){ toast(r.error,10000); return; } load(r); if(!r.error) toast("Profile loaded"); })
      .catch(function(){ toast("Could not reach OpenWarframe. Is the app still running?",10000); });
  };
}
function api(path, opts){ return fetch(path, opts).then(function(r){ return r.json(); }); }
// for things the player clicked: say so when the app can't be reached instead of doing nothing
function unreachable(){ toast("Could not reach OpenWarframe. Is the app still running?", 10000); }

// typing on a view without a list opens All items (and says so) instead of doing nothing
var NO_SEARCH={focus:1, overview:1, earn:1, rewards:1};
var searchTimer=null;
$("q").oninput=function(){
  var v=this.value;
  clearTimeout(searchTimer);
  searchTimer=setTimeout(function(){  // wait for a pause in typing: every render rebuilds the list
    Q=v.trim().toLowerCase();
    if(Q && NO_SEARCH[VIEW]){ goView("all"); try{ history.replaceState(null,"","#all"); }catch(e){} toast("Searching All items."); }
    renderAll();
  }, 150);
};
$("refresh").onclick=function(){ toast("Fetching your profile…", 20000); api("/api/sync",{method:"POST"}).then(function(d){
  // a failed refresh keeps what is on screen: only the very first load has nothing to keep
  if(d.error&&!d.setup&&DATA&&!DATA.error){ toast(d.error, 10000); return; }
  load(d); toast(d.error?d.error:"Profile refreshed"); }).catch(unreachable); };
$("loadinv").onclick=function(){ $("invfile").click(); };
$("export").onclick=exportAccount;
$("updatedata").onclick=updateGameData;
function grab(accept){
  toast("Reading the game session and downloading your inventory…", 60000);
  api("/api/inventory/grab",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({accept:accept===true})})
    .then(function(d){
      if(d.needs_consent){ $("toast").hidden=true; $("risktext").textContent=d.risk; $("consent").showModal(); return; }
      if(d.error){ toast(d.error,10000); return; }
      load(d); toast("Inventory loaded from the game");
    }).catch(unreachable);
}
$("grab").onclick=function(){ grab(false); };
if(MAC) $("grab").hidden=true;  // until the server says what works here (see load)
$("consent-yes").onclick=function(){ $("consent").close(); grab(true); };
$("consent-no").onclick=function(){ $("consent").close(); };  // Escape closes it too (native dialog)
function sendInventory(file){
  file.text().then(function(txt){ toast("Reading inventory…",20000); return api("/api/inventory",{method:"POST",headers:{"Content-Type":"application/json"},body:txt}); })
    .then(function(d){ if(d.error){ toast(d.error,8000); return; } load(d); toast("Inventory loaded"); })
    .catch(unreachable);
}
$("invfile").onchange=function(){ if(this.files[0]) sendInventory(this.files[0]); this.value=""; };
// Drop an inventory file anywhere. The overlay shows only while a file is dragged over the
// window, and hides itself once dragover stops arriving (drag ended, cancelled or left),
// so selecting and dragging text never leaves it stuck.
var dz=$("dropzone"), dzTimer=null;
function hideDrop(){ dz.hidden=true; clearTimeout(dzTimer); }
function dragHasFile(e){ var t=e.dataTransfer&&e.dataTransfer.types; return !!t && Array.prototype.indexOf.call(t,"Files")>=0; }
window.addEventListener("dragover",function(e){
  if(!dragHasFile(e)) return;
  e.preventDefault(); dz.hidden=false;
  clearTimeout(dzTimer); dzTimer=setTimeout(hideDrop, 400);
});
window.addEventListener("dragleave",function(e){ if(!e.relatedTarget) hideDrop(); });
window.addEventListener("dragend",hideDrop);
window.addEventListener("keydown",function(e){ if(e.key==="Escape"&&!dz.hidden) hideDrop(); });
dz.addEventListener("click",hideDrop);
window.addEventListener("drop",function(e){
  hideDrop();
  if(!dragHasFile(e)) return;
  e.preventDefault();
  var f=e.dataTransfer.files[0]; if(f) sendInventory(f);
});
$("csv").onclick=function(){
  var spec=currentSpec(), rows=sorted(filtered());
  var cols=spec.cols.map(function(c){return c.k});
  var cell=function(v){ v=v==null?"":(typeof v==="object"?JSON.stringify(v):String(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  var csv=[spec.cols.map(function(c){return c.l}).join(",")].concat(rows.map(function(r){ return cols.map(function(k){return cell(r[k])}).join(","); })).join("\r\n");
  var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"})); a.download="openwarframe-"+VIEW.toLowerCase()+".csv"; a.click();
};
setInterval(function(){ fetch("/api/ping").catch(function(){}); }, 10000);
// the world state feeds Live, Focus and the Next bar on every screen: keep it current everywhere
setInterval(function(){ if(DATA) loadLive(true); }, 60000);
// Foundry timers and the session countdown move with the clock
setInterval(function(){ if(DATA&&(VIEW==="foundry"||VIEW==="focus")) renderAll(); sessionTimeCheck(); }, 60000);
var DATA_VERSION=null;
setInterval(function(){
  api("/api/version").then(function(v){
    if(DATA_VERSION===null){ DATA_VERSION=v.version; return; }
    if(v.version!==DATA_VERSION){ DATA_VERSION=v.version; api("/api/data").then(function(d){ load(d); toast("New profile or inventory data loaded."); }); }
  }).catch(function(){});
}, 30000);
try{ VIEW=localStorage.getItem("owf-view")||"focus"; }catch(e){}
// deep links: http://127.0.0.1:<port>/#relics opens that tab
// #farm/finish also opens a sub-tab (What to farm and Live)
function hashView(){ var parts=decodeURIComponent((location.hash||"").slice(1)).toLowerCase().split("/"), hit=null; VIEWS.forEach(function(v){ if(v.id.toLowerCase()===parts[0]) hit=v.id; }); if(hit&&parts[1]) F={sub:parts[1]}; return hit; }
window.addEventListener("hashchange", function(){ var keepF=F; F={}; var hv=hashView(); if(!hv){ F=keepF; return; } var sub=F.sub; goView(hv); if(sub) F.sub=sub; if(DATA) renderAll(); });
$("view").innerHTML='<div class="empty" id="boot">Loading your account…</div>';
var bootTimer=setInterval(function(){ if(DATA||!$("boot")){ clearInterval(bootTimer); return; } api("/api/status").then(function(s){ var b=$("boot"); if(b&&s.status) b.textContent=s.status; }).catch(function(){}); }, 1500);
api("/api/prefs").then(function(p){ PREFS=Object.assign({goals:[],checks:{},settings:{},skipped:{}}, p||{});
  if((PREFS.settings||{}).start!=="last") VIEW="focus";
  var sub=null, hv=hashView(); if(hv){ sub=F.sub; VIEW=hv; }
  goView(VIEW); if(sub) F.sub=sub;  // filters and sort as you left them
  Object.keys(PREFS.views||{}).forEach(function(v){ if(PREFS.views[v]&&PREFS.views[v].sort) SORT[v]=PREFS.views[v].sort; });
  VIEW_STATE_SAVED=JSON.stringify(PREFS.views||{});
  restoreSession(); applySettings(); }).catch(function(){})
.then(function(){ return api("/api/data"); }).then(function(d){ load(d); checkUpdate(); }).catch(function(e){
  var net=e&&e.name==="TypeError"&&/fetch/i.test(e.message||"");
  $("view").innerHTML='<div class="empty">'+(net?"Could not reach the OpenWarframe server. Close this window and open OpenWarframe again.":"Something went wrong showing your data: "+esc(String((e&&e.message)||e)))+'</div>';
});
})();
