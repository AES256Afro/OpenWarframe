<style>
:root{--bg:#0a0f1d; --panel:#121a2c; --fg:#e7ecf6; --muted:#97a3bc; --line:#27334f; --gold:#d9b35b; --ok:#5fd49a; --violet:#a98cf5; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--fg); font:14px/1.35 "Segoe UI", system-ui, sans-serif; padding:10px 12px; display:grid; gap:8px; align-content:start}
.state{font:600 11px "Cascadia Mono", Consolas, monospace; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.state b{color:var(--gold)}
.pick{border:2px solid var(--gold); border-radius:10px; padding:10px 12px; background:var(--panel)}
.pick .k{font:600 11px "Cascadia Mono", Consolas, monospace; letter-spacing:.12em; color:var(--gold)}
.pick .n{font:700 20px "Segoe UI", system-ui, sans-serif}
.pick .w{color:var(--muted)}
ol{margin:0; padding-left:1.3em; display:grid; gap:3px; font-size:13px}
ol li{min-width:0; overflow-wrap:anywhere}
ol .w{color:var(--muted)}
.need{color:var(--ok)}
.vault{color:var(--violet)}
.empty{color:var(--muted)}
.age{font-size:12px; color:var(--muted)}
.now{justify-self:start; font:600 12px "Segoe UI", system-ui, sans-serif; color:var(--fg); background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:4px 10px; cursor:pointer}
.now:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
.stale .pick{border-color:var(--line); opacity:.6}
:root.hc{--muted:#c9d3e6; --line:#5a6a8c}
@media (prefers-reduced-motion:no-preference){ .pick{transition:opacity .2s} }
</style>
</head>
<body>
<div class="state" id="state">Connecting…</div>
<button type="button" id="now" class="now">Read the screen now</button>
<div id="out" class="empty" role="status" aria-live="polite">Waiting for a fissure reward screen.</div>
<div class="age" id="age"></div>
<script>
(function(){
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
  var shown="", last=null, state="";
  function ago(iso){
    var s=Math.max(0, Math.round((Date.now()-new Date(iso).getTime())/1000));
    return s<60?s+" s ago":s<3600?Math.round(s/60)+" min ago":Math.round(s/3600)+" h ago";
  }
  // an old pick must never look current: show how old it is, and dim it while a new screen
  // is being read or once it is more than two minutes old
  function freshness(){
    var out=document.getElementById("out"), age=document.getElementById("age");
    if(!last){ age.textContent=""; return; }
    var old=(Date.now()-new Date(last.time).getTime())>120000;
    out.classList.toggle("stale", state==="reading"||old||state==="off");
    age.textContent=(state==="reading"?"Reading the new screen… · ":"")+"This pick was read "+ago(last.time)+".";
  }
  function draw(d){
    var st=document.getElementById("state");
    state=d.state||"";
    var key=(d.hotkey&&d.hotkey.active)?" Or press "+d.hotkey.key+".":"";
    st.innerHTML=d.state==="watching"||d.state==="reading"?'<b>Watching</b> · '+esc(d.message):esc(d.state==="off"?"Not watching. Start it in the Reward helper view, or read the screen now."+key:d.message);
    var r=d.last; if(!r){ freshness(); return; }
    last=r;
    // prices arrive a moment after the pick: redraw when the ranking changes, not only the time
    var key=r.time+r.source+JSON.stringify(r.ranked); if(key===shown){ freshness(); return; } shown=key;
    var p=r.pick, h='';
    if(p) h+='<div class="pick"><div class="k">PICK'+(r.source==="sample"?' (sample screen)':'')+'</div><div class="n">'+esc(p.name)+'</div><div class="w">'+esc(p.why)+'</div></div>';
    h+='<ol start="2">'+r.ranked.slice(1).map(function(x){ var cls=x.why.indexOf("needed")>=0?"need":(x.why.indexOf("vaulted")>=0?"vault":""); return '<li class="'+cls+'">'+esc(x.name)+' <span class="w">· '+esc(x.why)+'</span></li>'; }).join('')+'</ol>';
    document.getElementById("out").className=""; document.getElementById("out").innerHTML=h;
    freshness();
  }
  // the main window's comfort settings (text size, contrast) apply here too
  function comfort(){
    fetch("/api/prefs").then(function(r){return r.json()}).then(function(p){
      var s=(p&&p.settings)||{};
      document.body.style.zoom=s.zoom||1;
      document.documentElement.classList.toggle("hc", !!s.contrast);
    }).catch(function(){});
  }
  comfort(); setInterval(comfort, 15000);
  function poll(){ fetch("/api/reward").then(function(r){return r.json()}).then(draw).catch(function(){ document.getElementById("state").textContent="OpenWarframe is not running."; }); }
  document.getElementById("now").onclick=function(){ fetch("/api/reward/capture",{method:"POST"}).then(function(r){return r.json()}).then(draw).catch(function(){}); };
  poll(); setInterval(poll, 1000);
})();
</script>
</body>
</html>
