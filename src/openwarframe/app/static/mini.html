<style>
:root{--bg:#0a0f1d; --panel:#121a2c; --fg:#e7ecf6; --muted:#97a3bc; --line:#27334f; --gold:#d9b35b; --ok:#5fd49a; --violet:#a98cf5; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--fg); font:14px/1.35 "Segoe UI", system-ui, sans-serif; padding:10px 12px; display:grid; gap:8px; align-content:start}
.state{font:600 11px "Cascadia Mono", Consolas, monospace; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.state b{color:var(--gold)}
.pick{border:2px solid var(--gold); border-radius:10px; padding:10px 12px; background:var(--panel)}
.pick .k{font:600 11px "Cascadia Mono", Consolas, monospace; letter-spacing:.12em; color:var(--gold)}
.pick .n{font:700 20px "Segoe UI", system-ui, sans-serif}
.pick .w{color:var(--muted)}
ol{margin:0; padding-left:1.3em; display:grid; gap:3px; font-size:13px}
ol li{min-width:0; overflow-wrap:anywhere}
ol .w{color:var(--muted)}
.need{color:var(--ok)}
.vault{color:var(--violet)}
.empty{color:var(--muted)}
</style>
</head>
<body>
<div class="state" id="state">Connecting…</div>
<div id="out" class="empty">Waiting for a fissure reward screen.</div>
<script>
(function(){
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
  var shown="";
  function draw(d){
    var st=document.getElementById("state");
    st.innerHTML=d.state==="watching"||d.state==="reading"?'<b>Watching</b> · '+esc(d.message):esc(d.state==="off"?"Not watching. Start it in the Rewards tab.":d.message);
    var r=d.last; if(!r){ return; }
    var key=r.time+r.source; if(key===shown) return; shown=key;
    var p=r.pick, h='';
    if(p) h+='<div class="pick"><div class="k">PICK'+(r.source==="sample"?' (sample screen)':'')+'</div><div class="n">'+esc(p.name)+'</div><div class="w">'+esc(p.why)+'</div></div>';
    h+='<ol start="2">'+r.ranked.slice(1).map(function(x){ var cls=x.why.indexOf("needed")>=0?"need":(x.why.indexOf("vaulted")>=0?"vault":""); return '<li class="'+cls+'">'+esc(x.name)+' <span class="w">· '+esc(x.why)+'</span></li>'; }).join('')+'</ol>';
    document.getElementById("out").className=""; document.getElementById("out").innerHTML=h;
  }
  function poll(){ fetch("/api/reward").then(function(r){return r.json()}).then(draw).catch(function(){ document.getElementById("state").textContent="OpenWarframe is not running."; }); }
  poll(); setInterval(poll, 1000);
})();
</script>
</body>
